<div class="box">
  <h1>ExamTopics CCNA 200-301</h1>
  <p>這一頁的內容經過加密，請輸入密碼。</p>
  <!-- ⚠️ 按鈕預設 disabled、form 預設攔截：密文常數有好幾 MB，瀏覽器解析那一段
       需要時間，在那之前 submit 事件還沒被接管。使用者若搶先按下去，<form> 會
       直接送出造成整頁重新載入，看起來就像「按了沒反應」。實測從入口頁點進來
       很容易碰到，所以由腳本就緒後才解鎖按鈕。 -->

    <input id="p" type="password" autocomplete="current-password" autofocus placeholder="密碼">
    <button id="b" type="submit" disabled>載入中…</button>

</div>

/* 不用 Uint8Array.from(atob(s),fn)：每個位元組呼叫一次函式，好幾 MB 的密文在手機上
   要好幾秒；普通迴圈快三十倍 */
const b64=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;};
async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  if(!GZ)return new TextDecoder().decode(out);
  return await new Response(new Blob([out]).stream()
    .pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html){
  /* document.write 是這裡少數可行的做法之一：要讓解出來的 HTML 連同它自己的
     <script> 一起真的被執行，innerHTML 做不到。 */
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),p=document.getElementById("p"),
      b=document.getElementById("b"),e=document.getElementById("e");
async function go(pw,quiet){
  b.disabled=true;e.textContent=quiet?"":"解密中…";
  try{
    const html=await unlock(pw);
    sessionStorage.setItem(SKEY,pw);        /* 只存到分頁關閉；同一份頁面重新整理免再打 */
    show(html);
  }catch(err){
    sessionStorage.removeItem(SKEY);
    b.disabled=false;e.textContent=quiet?"":"密碼不對。";
    if(quiet){e.textContent="";}
  }
}
f.addEventListener("submit",ev=>{ev.preventDefault();if(p.value)go(p.value,false);});
if(GZ&&typeof DecompressionStream==="undefined"){
  b.textContent="無法開啟";
  e.textContent="這個瀏覽器太舊（不支援 DecompressionStream），請更新瀏覽器。";
}else{
  b.disabled=false;b.textContent="解鎖";   /* 事件接上了，這時才讓人按 */
  p.focus();
  const saved=sessionStorage.getItem(SKEY);
  if(saved)go(saved,true);
}
