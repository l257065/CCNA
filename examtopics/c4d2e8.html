const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  return new TextDecoder().decode(out);
}
function show(html){
  /* document.write 是這裡少數可行的做法之一：要讓解出來的 HTML 連同它自己的
     <script> 一起真的被執行，innerHTML 做不到。 */
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),p=document.getElementById("p"),
      b=document.getElementById("b"),e=document.getElementById("e");
async function go(pw,quiet){
  b.disabled=true;e.textContent=quiet?"":"解密中…";
  try{
    const html=await unlock(pw);
    sessionStorage.setItem(SKEY,pw);        /* 只存到分頁關閉；同一份頁面重新整理免再打 */
    show(html);
  }catch(err){
    sessionStorage.removeItem(SKEY);
    b.disabled=false;e.textContent=quiet?"":"密碼不對。";
    if(quiet){e.textContent="";}
  }
}
f.addEventListener("submit",ev=>{ev.preventDefault();if(p.value)go(p.value,false);});
b.disabled=false;b.textContent="解鎖";   /* 事件接上了，這時才讓人按 */
p.focus();
const saved=sessionStorage.getItem(SKEY);
if(saved)go(saved,true);
</script>
